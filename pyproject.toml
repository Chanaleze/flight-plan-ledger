[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-plan-ledger"
version = "0.1.0"
description = "Permissioned immutable ledger for flight-plan integrity and audit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Flight Plan Ledger Contributors"}
]
dependencies = [
  "cryptography>=42.0.0",
  "pydantic>=2.0.0",
  "click>=8.0.0",
]

[project.scripts]
fpl = "flight_plan_ledger.cli.main:cli"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  'if __name__ == "__main__":',
  "pragma: no cover",
]

[tool.vercel]
# Tells Vercel which /api file-based function to load (BaseHTTPRequestHandler
# subclass in api/demo.py). Required — without it `vercel build` fails with
# "No python entrypoint found". See docs/demo.md.
entrypoint = "api.demo:handler"
